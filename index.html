<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var p = location.pathname;
      var i = p.indexOf('/pralay');
      var base = i >= 0 ? p.slice(0, i + 7) + '/' : (p.endsWith('/') ? p : p.replace(/[^/]*$/, '') || '/');
      if (!base.endsWith('/')) base += '/';
      document.write('<base href="' + base + '">');
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1a1030">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pralay">
  <title>Pralay — Ruins of Bharat</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+Devanagari:wght@400;600&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <!-- Title -->
    <section id="screen-title" class="screen active">
      <div class="title-bg"></div>
      <div class="title-content">
        <p class="title-tag">2087 · मुंबई खंडहर</p>
        <h1>PRALAY</h1>
        <p class="title-sub">Marine Drive to Dharavi. Create your survivor. Explore flooded Mumbai.</p>
        <button id="btn-play" class="btn-neon">Enter the City</button>
      </div>
    </section>

    <!-- Avatar Creator -->
    <section id="screen-avatar" class="screen">
      <div class="avatar-layout">
        <div class="avatar-panel">
          <h2>Create Your Survivor</h2>
          <label>Name <input type="text" id="avatar-name" maxlength="16" placeholder="Arjun" value="Arjun"></label>
          <label>Skin tone
            <input type="range" id="avatar-skin" min="0" max="4" value="2">
          </label>
          <label>Outfit color
            <input type="color" id="avatar-shirt" value="#e8841a">
          </label>
          <label>Pants color
            <input type="color" id="avatar-pants" value="#2d3a4a">
          </label>
          <label>Style
            <select id="avatar-style">
              <option value="wanderer">Wanderer</option>
              <option value="scavenger">Scavenger</option>
              <option value="monk">River Monk</option>
            </select>
          </label>
          <button id="btn-enter-world" class="btn-neon">Spawn on Marine Drive</button>
        </div>
        <div id="avatar-preview" class="avatar-preview"></div>
      </div>
    </section>

    <!-- 3D Game -->
    <section id="screen-game" class="screen">
      <canvas id="game-canvas"></canvas>

      <div id="hud">
        <div class="hud-top">
          <span id="hud-name" class="hud-name">—</span>
          <span id="hud-zone" class="hud-zone">Marine Drive</span>
        </div>
        <div id="hud-prompt" class="hud-prompt hidden">
          <span id="prompt-key">E</span>
          <span id="prompt-text">Interact</span>
        </div>
        <div id="hud-dialogue" class="hud-dialogue hidden">
          <strong id="dialogue-speaker">—</strong>
          <p id="dialogue-text"></p>
          <button id="dialogue-next" class="btn-small">Continue</button>
        </div>
        <div id="hud-log" class="hud-log"></div>
      </div>

      <!-- Mobile controls -->
      <div id="mobile-controls" class="mobile-controls">
        <div id="joystick-zone" class="joystick-zone"><div id="joystick-knob" class="joystick-knob"></div></div>
        <button id="btn-run" class="mobile-btn mobile-run">RUN</button>
        <button id="btn-interact" class="mobile-btn mobile-interact">E</button>
      </div>

      <div class="controls-hint desktop-only">
        WASD move · Shift run · E interact · Mouse drag look · Esc pause
      </div>
    </section>

    <!-- Pause -->
    <section id="screen-pause" class="screen overlay">
      <div class="pause-panel">
        <h2>Paused</h2>
        <button id="btn-resume" class="btn-neon">Resume</button>
        <button id="btn-quit" class="btn-ghost">Main Menu</button>
      </div>
    </section>
  </div>

  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
    <p id="loading-text">Loading Mumbai…</p>
  </div>

  <script type="module" src="js/boot.js"></script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
